name: New headphone model
description: Your Sony headphones are not supported by Knurl yet, and you ran knurl-probe on them.
title: "Model: <model name> (firmware <version>)"
labels: ["new-model"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Open Knurl Probe (`knurl-probe.exe`) with the headphones on, then "Save to a file" and attach the file (or use "Send", which opens the issue for you). From the command line, `knurl-probe-cli run` writes it to `reports/`: it holds no Bluetooth address and no personal names. Please do not attach a raw capture (`captures/raw/`): that one holds your headphones' Bluetooth address.
  - type: input
    id: model
    attributes:
      label: Model
      description: As Windows shows it in Bluetooth settings, without the `LE_` entry.
      placeholder: WH-1000XM5
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: From Sony's phone app (Headphones Connect / Sound Connect), if you know it.
  - type: textarea
    id: report
    attributes:
      label: The report
      description: Drag the file from `reports/` here, or paste what `knurl-probe-cli run` printed.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What you tried, what the headphones did, Windows version.
