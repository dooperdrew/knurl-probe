name: Release

# A tag v<version> equal to Cargo.toml's version builds knurl-probe.exe (the
# app) and knurl-probe-cli.exe (the command line), zips them with the
# READMEs, licences and third-party notices, checks the zip
# (scripts/package.py, the same check CI runs on every pull request) and
# attaches it to a DRAFT release. Publishing stays a manual step.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    name: windows zip
    # Only a tag pushed by the owner starts this: the self-hosted runner
    # (BEDROCK_RUNNER) when set, else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.BEDROCK_RUNNER || '"windows-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: write
      checks: read
    steps:
      - name: The tag is on main and its checks passed
        # A release is built only from a commit that reached main through a
        # green PR: the same SHA carries the PR's check runs.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $status = gh api "repos/$env:REPO/compare/main...$env:SHA" --jq .status
          if ($status -ne "identical" -and $status -ne "behind") {
            Write-Error "Commit $env:SHA is not on main (compare status: $status)"
            exit 1
          }
          $runs = (gh api "repos/$env:REPO/commits/$env:SHA/check-runs?per_page=100" | ConvertFrom-Json).check_runs
          # The latest completed run of each check decides: a failed re-run after
          # a green one blocks the release. Skipped runs don't count.
          foreach ($name in @("test / package (Windows)", "cargo deny", "workflow lint / actionlint / zizmor", "repo checks / repository hygiene", "docs / documentation")) {
            $latest = $runs | Where-Object { $_.name -eq $name -and $_.status -eq "completed" -and $_.conclusion -ne "skipped" } |
              Sort-Object { [datetime]$_.completed_at } | Select-Object -Last 1
            if (-not $latest -or $latest.conclusion -ne "success") {
              Write-Error "Check '$name' has not passed on $env:SHA (latest: $($latest.conclusion))"
              exit 1
            }
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Tag matches the workspace version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG does not match Cargo.toml version $version"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p knurl-probe-app -p knurl-probe

      - name: Zip and check it
        shell: pwsh
        run: |
          $zip = (python scripts/package.py --app target/release/knurl-probe.exe --cli target/release/knurl-probe-cli.exe --out dist | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          python scripts/package.py --notes $env:VERSION | Out-File -FilePath release-notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" --draft --verify-tag --title "knurl-probe $env:VERSION" --notes-file release-notes.md
