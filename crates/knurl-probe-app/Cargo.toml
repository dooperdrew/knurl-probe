[package]
name = "knurl-probe-app"
description = "Knurl Probe: checks Sony headphones read-only and prepares the report, for people who are not technical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
knurl-probe.workspace = true
knurl-report.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = "1.18"

[dev-dependencies]
# Only for examples/snapshot.rs (renders the screens to PNG without a display).
slint = { version = "1.18", features = ["software-renderer-path", "software-renderer-systemfonts"] }
png = "0.18"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
knurl-device.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
