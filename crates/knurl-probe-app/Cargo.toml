[package]
name = "knurl-probe-app"
description = "Knurl Probe: checks Sony headphones read-only and prepares the report, for people who are not technical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The app ships as knurl-probe.exe, the name people see; the command line is
# knurl-probe-cli.exe (crates/knurl-probe).
[[bin]]
name = "knurl-probe"
path = "src/main.rs"

[dependencies]
knurl-probe.workspace = true
knurl-report.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
slint = "1.18"

[dev-dependencies]
# Only for examples/snapshot.rs (renders the screens to PNG without a display).
slint = { version = "1.18", features = ["software-renderer-path", "software-renderer-systemfonts"] }
png = "0.18"

[build-dependencies]
slint-build = "1.18"
# The exe's icon and version information, rendered from design/icons as in the
# Knurl app (same versions, so nothing new is vetted).
embed-resource = "3.0.12"
png = "0.18"
resvg = { version = "0.48", default-features = false }

[target.'cfg(windows)'.dependencies]
knurl-device.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
