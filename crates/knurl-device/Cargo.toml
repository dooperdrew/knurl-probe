[package]
name = "knurl-device"
description = "Windows connection to Sony headphones: Bluetooth lookup, Winsock RFCOMM and the MDR session thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
knurl-protocol.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
]

[lints]
workspace = true
