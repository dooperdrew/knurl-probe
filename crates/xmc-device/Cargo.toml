[package]
name = "xmc-device"
description = "Windows connection to Sony WH-1000XM3/XM4 headphones (Winsock RFCOMM + MDR session)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
xmc-protocol.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
]

[lints]
workspace = true
