# cargo-deny: run in CI by .github/workflows/ci.yml (job "deny").
# Only the Windows target is built and shipped, so only its dependency graph counts.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Licences allowed in knurl-probe.exe, itself MIT OR Apache-2.0.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "BSL-1.0", "Unicode-3.0", "0BSD", "CC0-1.0", "Unlicense", "MIT-0",
]
confidence-threshold = 0.9
